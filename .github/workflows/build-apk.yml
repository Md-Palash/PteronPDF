name: Build APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Fonts: trims Google fonts to Latin and bundles Regular/Bold only (~25 KB each).
      # Fonts already committed under app/src/main/res/font are kept; a failed download never fails the build.
      - name: Fetch fonts
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install fonttools
          python3 tools/fetch_fonts.py

      # The runner already has the Android SDK. Just accept licenses so the
      # Android Gradle plugin can download the platform/build-tools it needs.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # AGP 8.7.3 needs Gradle 8.9+ and does NOT work with Gradle 9.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build benchmark APK (minified, real size)
        run: gradle :app:assembleBenchmark --stacktrace

      - name: Report APK sizes
        run: |
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variant | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/benchmark/*.apk; do
            [ -f "$f" ] && echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Show what is inside the benchmark APK
        run: |
          f=$(ls app/build/outputs/apk/benchmark/*arm64-v8a*.apk | head -1)
          {
            echo "### Largest files inside $(basename "$f") (compressed size, bytes)"
            echo '```'
            unzip -lv "$f" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {print $3, $2, $8}' | sort -nr | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: PteronPDF-debug
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PteronPDF-benchmark
          path: app/build/outputs/apk/benchmark/*.apk
